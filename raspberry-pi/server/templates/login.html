<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRIT Server</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:#0f172a;display:flex;align-items:center;
     justify-content:center;min-height:100vh;padding:16px}
.card{background:#1e293b;border-radius:20px;padding:40px 32px;
      width:100%;max-width:380px;box-shadow:0 25px 60px rgba(0,0,0,.6)}
.logo{text-align:center;margin-bottom:36px}
.logo h1{color:#38bdf8;font-size:32px;font-weight:700;letter-spacing:3px}
.logo p{color:#64748b;font-size:12px;margin-top:8px;letter-spacing:1px;text-transform:uppercase}
label{display:block;color:#94a3b8;font-size:12px;font-weight:600;
      text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
input[type=password]{width:100%;padding:14px 16px;background:#0f172a;
  border:1.5px solid #334155;border-radius:10px;color:#f1f5f9;
  font-size:15px;outline:none;transition:.2s}
input[type=password]:focus{border-color:#38bdf8}
button{width:100%;margin-top:24px;padding:14px;background:#0284c7;
  border:none;border-radius:10px;color:#fff;font-size:15px;
  font-weight:600;cursor:pointer;transition:.2s;letter-spacing:.5px}
button:hover{background:#0369a1}
button:active{transform:scale(.98)}
.err{color:#f87171;font-size:13px;margin-top:14px;text-align:center;
     background:#1e0a0a;padding:10px;border-radius:8px;border:1px solid #7f1d1d}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>MRIT</h1>
    <p>Painel de Configuracao</p>
  </div>
  <form method="post">
    <label>Senha de Acesso</label>
    <input type="password" name="password" placeholder="••••••••••••" autofocus required>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
